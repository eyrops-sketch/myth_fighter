<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mitos Tácticos 8-Bits - One Turn Kill</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: #000000;
            color: #00ffff;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            margin: 0;
            padding: 4px;
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        h1 {
            font-size: 14px;
            text-shadow: 2px 2px #ff00ff;
            margin: 6px 0;
            color: #ffff00;
        }
        #game-container {
            width: 100vw;
            max-width: 540px;
            margin: 0 auto;
            border: 4px solid #00ffff;
            background-color: #0a0a0a;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.6);
            position: relative;
        }
        .flash-red { background-color: #ff0000 !important; }
        .flash-white { background-color: #ffffff !important; }
        
        .stats-panel {
            font-size: 11px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #ff00ff;
            padding-bottom: 6px;
            color: #ffff00;
        }
        
        /* Layout principal: Imagen Izquierda, Barras Enemigo Derecha */
        .main-layout {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .left-image-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }
        .right-info-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: center;
        }
        #window-frame {
            width: 100%;
            aspect-ratio: 9/16;
            border: 4px solid #ff00ff;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        #monster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
        #monster-placeholder {
            font-size: 60px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        
        /* Sistema de 3 Barras (Rojo, Azul, Verde) */
        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #111;
            border: 3px solid #00ffff;
            padding: 6px;
        }
        .bar-title {
            font-size: 8px;
            color: #ff00ff;
            text-align: center;
            margin-bottom: 2px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 7px;
            color: #fff;
        }
        .bar-label {
            width: 35px;
            text-align: left;
        }
        .bar-outer {
            flex: 1;
            height: 12px;
            background: #222;
            border: 2px solid #fff;
            position: relative;
        }
        .bar-inner-hp { background-color: #ff0000; height: 100%; width: 100%; transition: width 0.3s; }
        .bar-inner-mana { background-color: #0088ff; height: 100%; width: 100%; transition: width 0.3s; }
        .bar-inner-fatigue { background-color: #00cc44; height: 100%; width: 100%; transition: width 0.3s; }

        .info-card {
            background-color: #000;
            border: 3px solid #ffff00;
            font-size: 8px;
            padding: 10px 4px;
            text-align: center;
            color: #00ffff;
            margin-top: 4px;
        }

        /* Botones unificados y GIGANTES */
        .selector-row {
            margin-bottom: 2px;
            text-align: left;
        }
        .selector-label {
            font-size: 8px;
            color: #ffff00;
            margin-bottom: 4px;
            display: block;
        }
        .row-grid-element {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }
        .row-grid-action {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 4px;
            margin-top: 4px;
        }
        .tactical-btn {
            background-color: #000;
            color: #00ffff;
            border: 3px solid #00ffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 7.5px;
            padding: 14px 2px;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s;
        }
        .tactical-btn.selected {
            background-color: #00ffff;
            color: #000;
            border-color: #ff00ff;
            transform: scale(1.05);
        }
        .tactical-btn:disabled {
            border-color: #444;
            color: #444;
            cursor: not-allowed;
        }
        #action-execute-btn {
            width: 100%;
            background-color: #ff00ff;
            color: #fff;
            border: 4px solid #ffff00;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 16px;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(255, 0, 255, 0.8);
            margin-top: 4px;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.02); }
            100% { transform: scale(1); }
        }
        #action-execute-btn:disabled {
            background-color: #222;
            border-color: #555;
            color: #666;
            animation: none;
            cursor: not-allowed;
        }
        
        #message {
            font-size: 9px;
            margin-top: 6px;
            min-height: 40px;
            line-height: 1.4;
            color: #ffff00;
            background-color: #111;
            border: 3px solid #ff00ff;
            padding: 8px;
        }

        #upgrade-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .upgrade-btn {
            background-color: #000;
            color: #00ffff;
            border: 4px solid #00ffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 16px;
            margin: 10px;
            cursor: pointer;
            width: 100%;
        }
        .upgrade-btn:hover {
            background-color: #00ffff;
            color: #000;
        }
    </style>
</head>
<body>

    <h1>MITOS TÁCTICOS 8-BIT</h1>
    
    <div id="game-container">
        
        <!-- Pantalla de Mejora tras ganar -->
        <div id="upgrade-screen">
            <h2 style="font-size: 12px; color: #ffff00; margin-bottom: 20px; line-height: 1.5;">🏆 ¡UN GOLPE LETAL!<br>ELIGE MEJORA</h2>
            <button class="upgrade-btn" onclick="applyUpgrade(1)">⭐ +20% DAÑO CRÍTICO</button>
            <button class="upgrade-btn" onclick="applyUpgrade(2)">💪 +15 DAÑO BASE</button>
        </div>

        <div class="stats-panel">
            <span id="hero-lvl-txt">NVL: 1</span>
            <span id="score-txt">PTS: 0</span>
        </div>

        <!-- 3 Barras del Héroe (Siempre a tope al inicio) -->
        <div class="bars-container">
            <div class="bar-title">TUS ESTADÍSTICAS</div>
            <div class="bar-row"><span class="bar-label">HP</span><div class="bar-outer"><div id="hero-hp-fill" class="bar-inner-hp"></div></div></div>
            <div class="bar-row"><span class="bar-label">MAN</span><div class="bar-outer"><div id="hero-mana-fill" class="bar-inner-mana"></div></div></div>
            <div class="bar-row"><span class="bar-label">FAT</span><div class="bar-outer"><div id="hero-fatigue-fill" class="bar-inner-fatigue" style="width: 0%;"></div></div></div>
        </div>

        <!-- Layout central: Imagen y Análisis del Enemigo -->
        <div class="main-layout">
            <div class="left-image-side">
                <div id="window-frame">
                    <img id="monster-img" src="" alt="Criatura" style="display: none;">
                    <div id="monster-placeholder">🚪</div>
                </div>
            </div>

            <div class="right-info-side">
                <div class="bars-container" style="border-color: #ff00ff;">
                    <div class="bar-title" style="color: #00ffff;">ANÁLISIS RIVAL</div>
                    <div class="bar-row"><span class="bar-label">HP</span><div class="bar-outer"><div id="enemy-hp-fill" class="bar-inner-hp"></div></div></div>
                    <div class="bar-row"><span class="bar-label">MAN</span><div class="bar-outer"><div id="enemy-mana-fill" class="bar-inner-mana"></div></div></div>
                    <div class="bar-row"><span class="bar-label">FAT</span><div class="bar-outer"><div id="enemy-fatigue-fill" class="bar-inner-fatigue"></div></div></div>
                </div>
                <div class="info-card" id="info-element">ELEM: ?</div>
            </div>
        </div>

        <!-- Fila 1: Elemento (Ventaja x Elemento) -->
        <div class="selector-row">
            <span class="selector-label">1. ELEMENTO PARA ATACAR:</span>
            <div class="row-grid-element">
                <button class="tactical-btn" onclick="selectOpt('element', 'Fuego', this)">FUEGO</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Hielo', this)">HIELO</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Tierra', this)">TIERRA</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Rayos', this)">RAYOS</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Veneno', this)">VENENO</button>
            </div>
        </div>

        <!-- Fila 2: Acción Táctica (Basado en barras rivales) -->
        <div class="selector-row">
            <span class="selector-label">2. TÁCTICA (Lee las barras del rival):</span>
            <div class="row-grid-action">
                <button class="tactical-btn" onclick="selectOpt('action', 'Fisico', this)">ATQ. FÍSICO<br><span style="font-size: 5px; color:#aaa;">(Si Fatiga Rival > 50%)</span></button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Agil', this)">GOLPE ÁGIL<br><span style="font-size: 5px; color:#aaa;">(Si Fatiga Rival < 50%)</span></button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Hechizo', this)">HECHIZO<br><span style="font-size: 5px; color:#aaa;">(Si Maná Rival < 50%)</span></button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Drenaje', this)">DRENAJE<br><span style="font-size: 5px; color:#aaa;">(Si Maná Rival > 50%)</span></button>
            </div>
        </div>

        <button id="action-execute-btn" onclick="executeOneTurnKill()" disabled>⚔️ ¡EJECUTAR COMBATE!</button>

        <div id="message">🚪 REGLA: Tienes 1 turno para fulminarlo o él te aniquilará a ti.</div>
                </div>
           <script>
        // CONFIGURACIÓN
        const DICE_MAX_SIDES = 10;      
        const elements = ["Fuego", "Hielo", "Tierra", "Rayos", "Veneno"];
        const elementalWinsAgainst = {
            "Fuego": ["Hielo", "Veneno"],
            "Hielo": ["Tierra", "Rayos"],
            "Tierra": ["Rayos", "Fuego"],
            "Rayos": ["Veneno", "Hielo"],
            "Veneno": ["Tierra", "Fuego"]
        };

        // ESTADÍSTICAS DEL HÉROE
        let heroLevel = 1;
        let score = 0;
        let extraCritBonus = 0; 
        let baseDamageBonus = 0;

        let currentEnemy = null;
        let combatActive = false;
        let selection = { element: null, action: null };

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type; 
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startGame() {
            heroLevel = 1;
            score = 0;
            extraCritBonus = 0;
            baseDamageBonus = 0;
            updateUI();
            nextEncounter();
        }

        function updateUI() {
            document.getElementById("hero-lvl-txt").innerText = `NVL: ${heroLevel}`;
            document.getElementById("score-txt").innerText = `PTS: ${score}`;
            
            // Las barras del héroe se recargan al máximo en cada nuevo combate
            document.getElementById("hero-hp-fill").style.width = "100%";
            document.getElementById("hero-mana-fill").style.width = "100%";
            document.getElementById("hero-fatigue-fill").style.width = "0%";
        }

        function nextEncounter() {
            combatActive = false;
            document.getElementById("monster-placeholder").style.display = "flex";
            document.getElementById("monster-placeholder").innerText = "🚪";
            document.getElementById("monster-img").style.display = "none";
            document.getElementById("window-frame").classList.remove("boss-glow");
            
            document.getElementById("info-element").innerText = "ELEM: ?";
            document.getElementById("message").innerText = "🚪 Buscando enemigo en la puerta...";
            
            document.getElementById("enemy-hp-fill").style.width = "100%";
            document.getElementById("enemy-mana-fill").style.width = "0%";
            document.getElementById("enemy-fatigue-fill").style.width = "0%";
            
            resetSelections();
            setAllButtonsEnabled(false);
            updateUI(); // Aseguramos barras llenas

            let waitTime = Math.random() * 1000 + 800;
            setTimeout(() => { openWindow(); }, waitTime);
        }

        function openWindow() {
            playBeep(440, 'square', 0.1); 

            let randomId = 1; // Ajustar límite máximo de imágenes aquí (ej: Math.floor(Math.random()*50)+1)
            let formattedName = String(randomId).padStart(4, '0') + ".jpg";

            let randomElem = elements[Math.floor(Math.random() * elements.length)];
            let targetLevel = heroLevel + Math.floor(Math.random() * 3);
            
            // Stats enemigas aleatorias para obligar al jugador a leer las barras
            let enemyMana = Math.floor(Math.random() * 100);
            let enemyFatigue = Math.floor(Math.random() * 100);
            let enemyHpBase = 120 + (targetLevel * 20);

            currentEnemy = {
                file: formattedName,
                level: targetLevel,
                hp: enemyHpBase,
                maxHp: enemyHpBase,
                mana: enemyMana,
                fatigue: enemyFatigue,
                element: randomElem
            };

            let imgElement = document.getElementById("monster-img");
            imgElement.src = `multimedia/${currentEnemy.file}`;
            applyElementFilter(currentEnemy.element, imgElement);

            document.getElementById("monster-placeholder").style.display = "none";
            imgElement.style.display = "block";
            
            document.getElementById("info-element").innerText = `ELEM: ${currentEnemy.element.toUpperCase()}`;
            
            // Pinta las barras del enemigo
            document.getElementById("enemy-hp-fill").style.width = "100%";
            document.getElementById("enemy-mana-fill").style.width = `${currentEnemy.mana}%`;
            document.getElementById("enemy-fatigue-fill").style.width = `${currentEnemy.fatigue}%`;

            document.getElementById("message").innerText = `⚠️ ¡UN SOLO TURNO! Usa el elemento contrario a ${currentEnemy.element} y lee sus barras.`;
            
            combatActive = true;
            setAllButtonsEnabled(true);
        }

        function applyElementFilter(element, imgElement) {
            let baseFilter = "grayscale(100%) contrast(150%) ";
            if (element === "Hielo") imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(140deg) saturate(400%)";
            else if (element === "Fuego") imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(-30deg) saturate(500%)";
            else if (element === "Tierra") imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(60deg) saturate(300%)";
            else if (element === "Rayos") imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(55deg) saturate(600%) brightness(120%)";
            else if (element === "Veneno") imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(90deg) saturate(400%) invert(20%)";
        }

        function triggerFlash(type) {
            playBeep(type === 'red' ? 120 : 580, 'square', 0.2);
            let container = document.getElementById("game-container");
            let frame = document.getElementById("window-frame");
            let flashClass = (type === 'red') ? 'flash-red' : 'flash-white';
            
            container.classList.add(flashClass);
            frame.classList.add(flashClass);
            setTimeout(() => {
                container.classList.remove(flashClass);
                frame.classList.remove(flashClass);
            }, 200);
        }

        function selectOpt(category, value, btnElement) {
            if (!combatActive) return;
            playBeep(800, 'sine', 0.05);
            selection[category] = value;

            let parentGrid = btnElement.parentNode;
            let buttons = parentGrid.getElementsByClassName("tactical-btn");
            for (let b of buttons) { b.classList.remove("selected"); }
            btnElement.classList.add("selected");

            if (selection.element && selection.action) {
                document.getElementById("action-execute-btn").disabled = false;
            }
        }

        function executeOneTurnKill() {
            if (!combatActive) return;
            combatActive = false;
            setAllButtonsEnabled(false);
            triggerFlash('white');

            let report = "";
            let basePower = 100 + baseDamageBonus;
            let multiplier = 1.0;

            // 1. RESOLUCIÓN ELEMENTAL
            if (elementalWinsAgainst[selection.element].includes(currentEnemy.element)) {
                multiplier *= 1.5;
                report += `🔥 ¡Elemento Efectivo (x1.5)!<br>`;
            } else if (selection.element === currentEnemy.element) {
                multiplier *= 0.8;
                report += `⚡ Choque Elemental (x0.8).<br>`;
            } else {
                multiplier *= 0.5;
                report += `💧 Desventaja Elemental (x0.5).<br>`;
            }

            // 2. RESOLUCIÓN TÁCTICA (El puzzle de las barras)
            let actionSuccess = false;
            if (selection.action === "Fisico" && currentEnemy.fatigue > 50) actionSuccess = true;
            if (selection.action === "Agil" && currentEnemy.fatigue <= 50) actionSuccess = true;
            if (selection.action === "Hechizo" && currentEnemy.mana < 50) actionSuccess = true;
            if (selection.action === "Drenaje" && currentEnemy.mana >= 50) actionSuccess = true;

            if (actionSuccess) {
                multiplier *= 2.0;
                report += `🎯 ¡Táctica Perfecta (x2.0)!<br>`;
                // Consumo visual de tus barras
                if(selection.action === "Hechizo" || selection.action === "Drenaje") document.getElementById("hero-mana-fill").style.width = "20%";
                else document.getElementById("hero-fatigue-fill").style.width = "80%";
            } else {
                multiplier *= 0.6;
                report += `❌ Táctica Errónea (x0.6).<br>`;
                document.getElementById("hero-fatigue-fill").style.width = "100%"; // Penalización
            }

            // 3. TIRADA DE DADO
            let diceRoll = Math.floor(Math.random() * DICE_MAX_SIDES) + 1;
            let diceMult = 1.0;
            if (diceRoll === 1) diceMult = 0.5;
            else if (diceRoll >= 2 && diceRoll <= 5) diceMult = 1.0;
            else if (diceRoll >= 6 && diceRoll <= 8) diceMult = 1.3 + extraCritBonus;
            else diceMult = 1.8 + extraCritBonus;

            multiplier *= diceMult;
            report += `🎲 Dado: ${diceRoll} (Mult. Final: x${multiplier.toFixed(2)})<br>`;

            // 4. DAÑO FINAL Y RESOLUCIÓN ONE-TURN
            let finalDamage = Math.floor(basePower * multiplier);
            currentEnemy.hp -= finalDamage;
            
            let hpPercentage = Math.max(0, (currentEnemy.hp / currentEnemy.maxHp) * 100);
            document.getElementById("enemy-hp-fill").style.width = `${hpPercentage}%`;

            if (currentEnemy.hp <= 0) {
                // VICTORIA (Lo mataste de 1 golpe)
                score += 1000;
                let bestScore = localStorage.getItem("mitos_best_score") || 0;
                if (score > bestScore) localStorage.setItem("mitos_best_score", score);
                
                playBeep(880, 'sine', 0.5); 
                document.getElementById("message").innerHTML = report + `💥 DAÑO: ${finalDamage}. ¡ENEMIGO DESTRUIDO!`;
                
                setTimeout(() => {
                    document.getElementById("upgrade-screen").style.display = "flex";
                }, 1500);

            } else {
                // DERROTA (Sobrevivió y te mata instantáneamente)
                document.getElementById("hero-hp-fill").style.width = "0%";
                triggerFlash('red');
                playBeep(150, 'sawtooth', 0.8);
                
                let bestScore = localStorage.getItem("mitos_best_score") || 0;
                document.getElementById("message").innerHTML = report + `💥 DAÑO: ${finalDamage}. No fue suficiente...<br>💀 EL ENEMIGO SOBREVIVE Y TE ANIQUILA. (Récord: ${bestScore})`;
                
                document.getElementById("monster-img").style.display = "none";
                document.getElementById("monster-placeholder").style.display = "flex";
                document.getElementById("monster-placeholder").innerText = "💀";
            }
        }

        function applyUpgrade(choice) {
            playBeep(950, 'square', 0.2);
            heroLevel++;
            if (choice === 1) extraCritBonus += 0.2; 
            else if (choice === 2) baseDamageBonus += 15;
            
            document.getElementById("upgrade-screen").style.display = "none";
            nextEncounter();
        }

        function resetSelections() {
            selection = { element: null, action: null };
            let allBtns = document.getElementsByClassName("tactical-btn");
            for (let b of allBtns) { b.classList.remove("selected"); }
            document.getElementById("action-execute-btn").disabled = true;
        }

        function setAllButtonsEnabled(enabled) {
            let allBtns = document.getElementsByClassName("tactical-btn");
            for (let b of allBtns) { b.disabled = !enabled; }
            if (!enabled) document.getElementById("action-execute-btn").disabled = true;
        }

        startGame();
    </script>
</body>
                </html>
