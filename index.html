<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mitos Tácticos 8-Bits - Edición Definitiva</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: #000008;
            color: #00ffff;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            margin: 0;
            padding: 2px;
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        h1 {
            font-size: 13px;
            text-shadow: 2px 2px #ff0077;
            margin: 6px 0;
            color: #ffff00;
        }
        #game-container {
            width: 100vw;
            max-width: 540px;
            margin: 0 auto;
            border: 4px solid #00ffff;
            background-color: #050515;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 6px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            position: relative;
        }
        .flash-red {
            background-color: #660000 !important;
            border-color: #ff0000 !important;
        }
        .flash-white {
            background-color: #ffffff !important;
        }
        .stats-panel {
            font-size: 9px;
            display: flex;
            justify-content: space-between;
            border-bottom: 2px dashed #ff0077;
            padding-bottom: 6px;
            color: #ffff00;
        }
        /* Layout principal: Imagen a la izquierda, Estados a la derecha */
        .main-layout {
            display: flex;
            gap: 8px;
        }
        .left-image-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
        }
        .right-info-side {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: space-between;
        }
        #window-frame {
            width: 100%;
            aspect-ratio: 9/16;
            border: 3px solid #ff0077;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        .boss-glow {
            border-color: #ffff00 !important;
            box-shadow: inset 0 0 20px #ff0000;
        }
        #monster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
        #monster-placeholder {
            font-size: 54px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        .info-card {
            background-color: #002244;
            border: 2px solid #00ffff;
            font-size: 7px;
            padding: 8px 4px;
            text-align: center;
            color: #ffff00;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* Contenedores de las 3 barras (HP, Maná, Fatiga) */
        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 3px;
            background: #001122;
            border: 2px solid #00ffff;
            padding: 4px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 5px;
            color: #fff;
        }
        .bar-label {
            width: 35px;
            text-align: left;
        }
        .bar-outer {
            flex: 1;
            height: 7px;
            background: #222;
            border: 1px solid #fff;
            position: relative;
        }
        .bar-inner-hp { background-color: #ff0000; height: 100%; width: 100%; transition: width 0.3s; }
        .bar-inner-mana { background-color: #0088ff; height: 100%; width: 100%; transition: width 0.3s; }
        .bar-inner-fatigue { background-color: #00cc44; height: 100%; width: 100%; transition: width 0.3s; }

        #timer-bar-container {
            width: 100%;
            background-color: #001122;
            border: 2px solid #00ffff;
            height: 7px;
            margin: 2px 0;
        }
        #timer-bar-fill {
            background-color: #00ffff;
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }
        .selector-row {
            margin-bottom: 4px;
            text-align: left;
        }
        .selector-label {
            font-size: 7px;
            color: #ff0077;
            margin-bottom: 3px;
            display: block;
        }
        .row-grid-flexible {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 3px;
        }
        .tactical-btn {
            background-color: #003366;
            color: #00ffff;
            border: 2px solid #00ffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 6px;
            padding: 10px 2px;
            cursor: pointer;
            text-align: center;
        }
        .tactical-btn.selected {
            background-color: #00ffff;
            color: #000008;
            border-color: #ffff00;
        }
        .tactical-btn:disabled {
            border-color: #444;
            color: #555;
            cursor: not-allowed;
        }
        #action-execute-btn {
            width: 100%;
            background-color: #ff0077;
            color: #fff;
            border: 2px solid #ffff00;
            font-family: 'Press Start 2P', monospace;
            font-size: 8.5px;
            padding: 12px;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(255, 0, 119, 0.8);
            margin-top: 2px;
        }
        #action-execute-btn:hover:not(:disabled) {
            background-color: #ff3399;
        }
        #action-execute-btn:disabled {
            background-color: #331122;
            border-color: #555;
            color: #888;
            cursor: not-allowed;
        }
        #message {
            font-size: 7.5px;
            margin-top: 4px;
            min-height: 28px;
            line-height: 1.3;
            color: #ffff00;
            background-color: #001122;
            border: 2px solid #00ffff;
            padding: 6px;
        }
        #upgrade-screen {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 12, 0.98);
            z-index: 10;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .upgrade-btn {
            background-color: #003366;
            color: #ffff00;
            border: 2px solid #ffff00;
            font-family: 'Press Start 2P', monospace;
            font-size: 8px;
            padding: 14px;
            margin: 8px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <h1>MITOS TÁCTICOS 8-BIT</h1>
    
    <div id="game-container">
        
        <div id="upgrade-screen">
            <h2 style="font-size: 10px; color: #ffff00; margin-bottom: 14px;">🏆 ¡VICTORIA! ELIGE UNA MEJORA</h2>
            <button class="upgrade-btn" onclick="applyUpgrade(1)">⭐ +20% Daño Crítico D10</button>
            <button class="upgrade-btn" onclick="applyUpgrade(2)">❤️ +30 HP Máximos</button>
            <button class="upgrade-btn" onclick="applyUpgrade(3)">⏱️ +3s extra Cronómetro</button>
        </div>

        <div class="stats-panel">
            <span id="hero-lvl-txt">NVL: 1</span>
            <span id="score-txt">PTS: 0</span>
        </div>

        <!-- 3 Barras del Héroe -->
        <div class="bars-container">
            <div class="bar-row"><span class="bar-label">HP:</span><div class="bar-outer"><div id="hero-hp-fill" class="bar-inner-hp"></div></div></div>
            <div class="bar-row"><span class="bar-label">MAN:</span><div class="bar-outer"><div id="hero-mana-fill" class="bar-inner-mana"></div></div></div>
            <div class="bar-row"><span class="bar-label">FAT:</span><div class="bar-outer"><div id="hero-fatigue-fill" class="bar-inner-fatigue" style="width: 0%;"></div></div></div>
        </div>

        <!-- Layout superior: Imagen a la izquierda, Estados a la derecha -->
        <div class="main-layout">
            <div class="left-image-side">
                <div id="window-frame">
                    <img id="monster-img" src="" alt="Criatura" style="display: none;">
                    <div id="monster-placeholder">🚪</div>
                </div>
            </div>

            <div class="right-info-side">
                <div class="info-card" id="info-target-lvl">OBJ NVL: ?</div>
                <div class="info-card" id="info-estado-alterado">ESTADO: OK</div>
                <div class="info-card" id="info-dado">DADO: [ 🎲 ]</div>
            </div>
        </div>

        <!-- 3 Barras del Objetivo / Enemigo -->
        <div class="bars-container">
            <div class="bar-row"><span class="bar-label">EN-HP:</span><div class="bar-outer"><div id="enemy-hp-fill" class="bar-inner-hp"></div></div></div>
            <div class="bar-row"><span class="bar-label">EN-MAN:</span><div class="bar-outer"><div id="enemy-mana-fill" class="bar-inner-mana"></div></div></div>
            <div class="bar-row"><span class="bar-label">EN-FAT:</span><div class="bar-outer"><div id="enemy-fatigue-fill" class="bar-inner-fatigue" style="width: 0%;"></div></div></div>
        </div>

        <div id="timer-bar-container">
            <div id="timer-bar-fill" class="timer-bar-fill"></div>
        </div>

        <!-- Fila 1: Elementos -->
        <div class="selector-row">
            <span class="selector-label">1. ELEMENTO TÁCTICO:</span>
            <div class="row-grid-flexible" style="grid-template-columns: repeat(5, 1fr);">
                <button class="tactical-btn" onclick="selectOpt('element', 'Fuego', this)">FUEGO</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Hielo', this)">HIELO</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Tierra', this)">TIERRA</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Rayos', this)">RAYOS</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Veneno', this)">VENENO</button>
            </div>
        </div>

        <!-- Fila 2 y 3 unificadas en un panel táctico compacto sin duplicidades -->
        <div class="selector-row">
            <span class="selector-label">2. ACCIÓN Y RECURSO UNIFICADOS:</span>
            <div class="row-grid-flexible" style="grid-template-columns: repeat(4, 1fr);">
                <button class="tactical-btn" onclick="selectOpt('action', 'Ataque Físico', this)">ATQ FÍSICO</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Hechizo Mágico', this)">HECHIZO</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Arma Pesada', this)">ARMA</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Defensa Total', this)">DEFENSA</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Esquiva Rápida', this)">ESQUIVA</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Contraataque', this)">CONTRA</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Usar Poción', this)">POCIÓN</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Usar Talismán', this)">TALISMÁN</button>
            </div>
        </div>

        <button id="action-execute-btn" onclick="executeTurnWithDice()" disabled>🎲 ¡LANZAR DADO Y EJECUTAR!</button>

        <div id="message">🚪 Espera a que se abra la ventana...</div>
    </div>
        <script>
        let TURN_TIME_LIMIT = 12; 
        const DICE_MAX_SIDES = 10;      

        const elements = ["Fuego", "Hielo", "Tierra", "Rayos", "Veneno"];
        const elementalWinsAgainst = {
            "Fuego": ["Hielo", "Veneno"],
            "Hielo": ["Tierra", "Rayos"],
            "Tierra": ["Rayos", "Fuego"],
            "Rayos": ["Veneno", "Hielo"],
            "Veneno": ["Tierra", "Fuego"]
        };

        let heroLevel = 1;
        let heroMaxHp = 100;
        let heroHp = 100;
        let heroMaxMana = 100;
        let heroMana = 100;
        let heroFatigue = 0; // 0 a 100

        let score = 0;
        let currentEnemy = null;
        let combatActive = false;
        let extraCritBonus = 0; 

        let selection = { element: null, action: null };
        let timeLeft = TURN_TIME_LIMIT;
        let timerInterval = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration) {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type; 
            osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + duration);
        }

        function startGame() {
            heroLevel = 1;
            heroMaxHp = 100;
            heroHp = 100;
            heroMaxMana = 100;
            heroMana = 100;
            heroFatigue = 0;
            score = 0;
            extraCritBonus = 0;
            updateUI();
            nextEncounter();
        }

        function updateUI() {
            document.getElementById("hero-lvl-txt").innerText = `NVL: ${heroLevel}`;
            document.getElementById("score-txt").innerText = `PTS: ${score}`;
            
            document.getElementById("hero-hp-fill").style.width = Math.max(0, (heroHp / heroMaxHp) * 100) + "%";
            document.getElementById("hero-mana-fill").style.width = Math.max(0, (heroMana / heroMaxMana) * 100) + "%";
            document.getElementById("hero-fatigue-fill").style.width = Math.min(100, heroFatigue) + "%";
        }

        function nextEncounter() {
            combatActive = false;
            document.getElementById("monster-placeholder").style.display = "flex";
            document.getElementById("monster-placeholder").innerText = "🚪";
            document.getElementById("monster-img").style.display = "none";
            document.getElementById("window-frame").classList.remove("boss-glow");
            
            document.getElementById("info-target-lvl").innerText = "OBJ NVL: ?";
            document.getElementById("info-estado-alterado").innerText = "ESTADO: OK";
            document.getElementById("info-dado").innerText = "DADO: [ 🎲 ]";

            document.getElementById("message").innerText = "🚪 Buscando enemigo en la puerta...";
            document.getElementById("enemy-mana-fill").style.width = "100%";
            document.getElementById("enemy-fatigue-fill").style.width = "0%";
            
            resetSelections();
            setAllButtonsEnabled(false);

            let waitTime = Math.random() * 1500 + 1000;
            setTimeout(() => { openWindow(); }, waitTime);
        }

        function openWindow() {
            playBeep(440, 'square', 0.1); 

            let randomId = 1; // Cambiar número máximo si añades más imágenes (ej: Math.floor(Math.random() * 50) + 1)
            let formattedName = String(randomId).padStart(4, '0') + ".jpg";

            let randomElem = elements[Math.floor(Math.random() * elements.length)];
            let isBoss = (heroLevel % 5 === 0);
            let targetLevel = isBoss ? heroLevel + 3 : Math.max(1, heroLevel + Math.floor(Math.random() * 7) - 3);
            let enemyHpBase = isBoss ? 150 + (targetLevel * 10) : 70 + (targetLevel * 5);

            currentEnemy = {
                file: formattedName,
                level: targetLevel,
                hp: enemyHpBase,
                maxHp: enemyHpBase,
                mana: 100,
                maxMana: 100,
                fatigue: 0,
                element: randomElem,
                isBoss: isBoss,
                status: null,
                statusTurns: 0
            };

            let imgElement = document.getElementById("monster-img");
            imgElement.src = `multimedia/${currentEnemy.file}`;
            applyElementFilter(currentEnemy.element, imgElement);

            document.getElementById("monster-placeholder").style.display = "none";
            imgElement.style.display = "block";
            
            if (isBoss) {
                document.getElementById("window-frame").classList.add("boss-glow");
                document.getElementById("info-target-lvl").innerText = `¡JEFE NVL ${targetLevel}!`;
                playBeep(220, 'sawtooth', 0.4); 
            } else {
                document.getElementById("info-target-lvl").innerText = `OBJ NVL: ${targetLevel}`;
            }

            document.getElementById("message").innerText = isBoss ? "⚠️ ¡JEFE SUPREMO APARECIDO!" : "⚔️ ¡Ventana abierta! Elige tu táctica.";
            
            combatActive = true;
            setAllButtonsEnabled(true);
            startTimer();
        }

        function applyElementFilter(element, imgElement) {
            let baseFilter = "grayscale(100%) contrast(150%) ";
            if (element === "Hielo") {
                imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(140deg) saturate(400%)";
            } else if (element === "Fuego") {
                imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(-30deg) saturate(500%)";
            } else if (element === "Tierra") {
                imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(60deg) saturate(300%)";
            } else if (element === "Rayos") {
                imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(55deg) saturate(600%) brightness(120%)";
            } else if (element === "Veneno") {
                imgElement.style.filter = baseFilter + "sepia(100%) hue-rotate(90deg) saturate(400%) invert(20%)";
            }
        }

        function triggerFlash(type) {
            playBeep(type === 'red' ? 120 : 580, 'square', 0.15);
            let container = document.getElementById("game-container");
            let frame = document.getElementById("window-frame");
            let img = document.getElementById("monster-img");
            let flashClass = (type === 'red') ? 'flash-red' : 'flash-white';
            
            container.classList.add(flashClass);
            frame.classList.add(flashClass);
            if(img) img.style.opacity = "0.2";

            setTimeout(() => {
                container.classList.remove(flashClass);
                frame.classList.remove(flashClass);
                if(img) img.style.opacity = "1";
            }, 150);
        }

        function selectOpt(category, value, btnElement) {
            if (!combatActive) return;
            playBeep(800, 'sine', 0.05);
            selection[category] = value;

            let parentGrid = btnElement.parentNode;
            let buttons = parentGrid.getElementsByClassName("tactical-btn");
            for (let b of buttons) { b.classList.remove("selected"); }
            btnElement.classList.add("selected");

            if (selection.element && selection.action) {
                document.getElementById("action-execute-btn").disabled = false;
            }
        }

        function startTimer() {
            timeLeft = TURN_TIME_LIMIT;
            let timerFill = document.getElementById("timer-bar-fill");
            timerFill.style.width = "100%";

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                let percent = (timeLeft / TURN_TIME_LIMIT) * 100;
                timerFill.style.width = Math.max(0, percent) + "%";

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleTimeOut();
                }
            }, 100);
        }

        function handleTimeOut() {
            if (!combatActive) return;
            if (!selection.element) selection.element = "Fuego";
            if (!selection.action) selection.action = "Defensa Total";

            document.getElementById("message").innerText = "⏰ ¡Tiempo agotado! Turno automático.";
            setTimeout(() => { executeTurnWithDice(); }, 800);
        }

        function executeTurnWithDice() {
            if (!combatActive) return;
            clearInterval(timerInterval);
            combatActive = false;
            setAllButtonsEnabled(false);

            if (!selection.element) selection.element = "Fuego";
            if (!selection.action) selection.action = "Defensa Total";

            triggerFlash('white');

            // 1. Gasto de Maná y Fatiga según la acción elegida
            let manaCost = 0;
            let fatigueGain = 12;

            if (selection.action === "Hechizo Mágico") {
                manaCost = 35;
                fatigueGain = 20;
            } else if (selection.action === "Arma Pesada" || selection.action === "Carga") {
                fatigueGain = 25;
            } else if (selection.action === "Usar Poción") {
                heroHp = Math.min(heroMaxHp, heroHp + 40);
                heroMana = Math.min(heroMaxMana, heroMana + 20);
                fatigueGain = -15; // Las pociones reducen fatiga
            } else if (selection.action === "Usar Talismán") {
                extraCritBonus += 0.15;
                manaCost = 20;
            }

            // Aplicar Maná del Héroe
            if (heroMana >= manaCost) {
                heroMana -= manaCost;
            } else {
                heroMana = 0;
                fatigueGain += 30; // Castigo por falta de maná
            }

            // Aplicar Fatiga
            heroFatigue = Math.max(0, heroFatigue + fatigueGain);
            let heroFatiguePenalty = heroFatigue > 70 ? 0.5 : (heroFatigue > 40 ? 0.8 : 1.0);

            // 2. Tirada de Dado D10
            let diceRoll = Math.floor(Math.random() * DICE_MAX_SIDES) + 1;
            let baseCoefficient = 1.0;

            if (diceRoll === 1) baseCoefficient = 0.4;
            else if (diceRoll >= 2 && diceRoll <= 5) baseCoefficient = 1.0;
            else if (diceRoll >= 6 && diceRoll <= 8) baseCoefficient = 1.3 + extraCritBonus;
            else baseCoefficient = 1.9 + extraCritBonus;

            let levelDiff = heroLevel - currentEnemy.level;
            let heroCoefficient = baseCoefficient * heroFatiguePenalty;

            document.getElementById("info-dado").innerText = `DADO: [ ${diceRoll}/${DICE_MAX_SIDES} ]`;

            let baseDamagePool = 60;
            let totalPower = 0;
            let report = `🎲 [Dado: ${diceRoll}] `;

            // Efecto Elemental
            if (elementalWinsAgainst[selection.element].includes(currentEnemy.element)) {
                totalPower += baseDamagePool * 0.4;
                report += `🔥 ¡Elemento fuerte! `;
            } else if (selection.element === currentEnemy.element) {
                totalPower += baseDamagePool * 0.15;
                report += `⚡ Choque elemental. `;
            } else {
                totalPower += baseDamagePool * 0.05;
                report += `💧 Desventaja. `;
            }

            // Efecto Acción Unificada
            if (selection.action === "Ataque Físico") totalPower += baseDamagePool * 0.35;
            else if (selection.action === "Hechizo Mágico") totalPower += heroMana > 0 ? baseDamagePool * 0.6 : baseDamagePool * 0.2;
            else if (selection.action === "Arma Pesada") totalPower += baseDamagePool * 0.5;

            let finalDamageToEnemy = Math.floor(totalPower * heroCoefficient);
            currentEnemy.hp -= finalDamageToEnemy;
            updateEnemyHpBar();

            report += `💥 Haces ${finalDamageToEnemy} DMG. `;

            // Comprobar Victoria
            if (currentEnemy.hp <= 0) {
                score += currentEnemy.isBoss ? 1500 : 500;
                heroLevel++;
                heroMana = heroMaxMana; // Regenerar maná al subir
                heroFatigue = Math.max(0, heroFatigue - 40); // Aliviar fatiga
                updateUI();
                playBeep(880, 'sine', 0.5); 

                let bestScore = localStorage.getItem("mitos_best_score") || 0;
                if (score > bestScore) localStorage.setItem("mitos_best_score", score);

                document.getElementById("message").innerText = `🏆 ¡VICTORIA! Derrotaste al rival. Subes a Nivel ${heroLevel}.`;
                document.getElementById("upgrade-screen").style.display = "flex";
                return;
            }

            // Turno del Enemigo influenciado por sus 3 barras (HP, Maná, Fatiga)
            let enemyFatiguePenalty = currentEnemy.fatigue > 60 ? 0.6 : 1.0;
            let enemyDmg = Math.floor((Math.random() * 20 + 12) * enemyFatiguePenalty);
            if (currentEnemy.isBoss) enemyDmg *= 1.5;

            currentEnemy.fatigue = Math.min(100, currentEnemy.fatigue + 15);
            if (currentEnemy.mana > 15) currentEnemy.mana -= 15;

            // Modificadores defensivos del Héroe
            if (selection.action === "Defensa Total") {
                enemyDmg = Math.floor(enemyDmg / 3);
                report += "🛡️ ¡Defensa activa! ";
            } else if (selection.action === "Esquiva Rápida" && Math.random() > 0.3) {
                enemyDmg = 0;
                report += "💨 ¡Esquivado por completo! ";
            } else if (selection.action === "Contraataque") {
                enemyDmg = Math.floor(enemyDmg / 2);
                currentEnemy.hp -= 15;
                report += "⚔️ ¡Contraataque (-15 HP al rival)! ";
            }

            if (enemyDmg > 0) triggerFlash('red');

            heroHp -= enemyDmg;
            updateUI();

            // Comprobar Derrota
            if (heroHp <= 0) { 
                gameOver(); 
                return; 
            }

            document.getElementById("message").innerText = report + `⚠️ Recibes ${enemyDmg} daño.`;
            setTimeout(nextEncounter, 3500);
        }

        function applyUpgrade(choice) {
            playBeep(950, 'square', 0.2);
            if (choice === 1) extraCritBonus += 0.2;
            else if (choice === 2) { heroMaxHp += 30; heroHp = heroMaxHp; }
            else if (choice === 3) TURN_TIME_LIMIT += 3;

            document.getElementById("upgrade-screen").style.display = "none";
            updateUI();
            nextEncounter();
        }

        function updateEnemyHpBar() {
            let percentage = (currentEnemy.hp / currentEnemy.maxHp) * 100;
            document.getElementById("enemy-hp-fill").style.width = Math.max(0, percentage) + "%";
            document.getElementById("enemy-mana-fill").style.width = Math.max(0, (currentEnemy.mana / currentEnemy.maxMana) * 100) + "%";
            document.getElementById("enemy-fatigue-fill").style.width = Math.min(100, currentEnemy.fatigue) + "%";
        }

        function resetSelections() {
            selection = { element: null, action: null };
            let allBtns = document.getElementsByClassName("tactical-btn");
            for (let b of allBtns) { b.classList.remove("selected"); }
            document.getElementById("action-execute-btn").disabled = true;
        }

        function setAllButtonsEnabled(enabled) {
            let allBtns = document.getElementsByClassName("tactical-btn");
            for (let b of allBtns) { b.disabled = !enabled; }
            if (!enabled) document.getElementById("action-execute-btn").disabled = true;
        }

        function gameOver() {
            combatActive = false;
            playBeep(150, 'sawtooth', 0.8);
            let best = localStorage.getItem("mitos_best_score") || score;
            document.getElementById("monster-img").style.display = "none";
            document.getElementById("monster-placeholder").style.display = "flex";
            document.getElementById("monster-placeholder").innerText = "💀";
            document.getElementById("message").innerText = `💀 ¡DERROTA! Has caído en Nvl ${heroLevel}. Pts: ${score} (Récord: ${best}). Recarga para reiniciar.`;
        }

        startGame();
    </script>
</body>
</html>
