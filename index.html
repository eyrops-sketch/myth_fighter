<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mitos Tácticos 8-Bits - Cian Definitivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: #000000;
            color: #00ffff;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            margin: 0;
            padding: 4px;
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }
        h1 {
            font-size: 13px;
            text-shadow: 2px 2px #00ffff;
            margin: 4px 0;
            color: #ffff00;
        }
        #game-container {
            width: 100vw;
            max-width: 600px;
            margin: 0 auto;
            border: 4px solid #00ffff;
            background-color: #05050a;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
            position: relative;
        }
        .flash-red { background-color: #ff0000 !important; }
        .flash-white { background-color: #ffffff !important; }
        .flash-green { background-color: #00ff00 !important; }
        
        .stats-panel {
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed #00ffff;
            padding-bottom: 6px;
            color: #ffff00;
        }
        
        #entorno-banner {
            background-color: #001122;
            border: 3px solid #00ffff;
            color: #00ffff;
            font-size: 9px;
            padding: 8px;
            line-height: 1.4;
        }

        .main-layout {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .left-image-side {
            flex: 1.1;
            display: flex;
            flex-direction: column;
        }
        .right-info-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: space-between;
        }
        #window-frame {
            width: 100%;
            aspect-ratio: 9/16;
            border: 3px solid #00ffff;
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }
        #monster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
        #monster-placeholder {
            font-size: 50px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        
        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #001122;
            border: 3px solid #00ffff;
            padding: 8px;
            height: 100%;
            box-sizing: border-box;
            justify-content: space-around;
        }
        .bar-title {
            font-size: 9px;
            color: #00ffff;
            text-align: center;
            margin-bottom: 4px;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 8px;
            color: #fff;
        }
        .bar-label {
            width: 38px;
            text-align: left;
            color: #ffff00;
        }
        .bar-outer {
            flex: 1;
            height: 14px;
            background: #222;
            border: 2px solid #fff;
            position: relative;
        }
        .bar-inner-hp { background-color: #ff0000; height: 100%; width: 100%; transition: width 0.5s; }
        .bar-inner-mana { background-color: #0088ff; height: 100%; width: 100%; transition: width 0.5s; }
        .bar-inner-energy { background-color: #00cc44; height: 100%; width: 100%; transition: width 0.5s; }

        .info-card {
            background-color: #000;
            border: 3px solid #ffff00;
            font-size: 9px;
            padding: 10px 4px;
            text-align: center;
            color: #00ffff;
        }

        #timer-bar-container {
            width: 100%;
            background-color: #001122;
            border: 3px solid #00ffff;
            height: 10px;
        }
        #timer-bar-fill {
            background-color: #00ffff;
            height: 100%;
            width: 100%;
            transition: width 0.1s linear;
        }

        .selector-row {
            margin-bottom: 3px;
            text-align: left;
        }
        .selector-label {
            font-size: 8px;
            color: #ffff00;
            margin-bottom: 4px;
            display: block;
        }
        .row-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .row-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .row-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

        .tactical-btn {
            background-color: #001122;
            color: #00ffff;
            border: 3px solid #00ffff;
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 12px 2px;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s;
        }
        .tactical-btn.selected {
            background-color: #00ffff;
            color: #000;
            border-color: #ffff00;
            transform: scale(1.05);
        }
        .tactical-btn:disabled {
            border-color: #333;
            color: #555;
            cursor: not-allowed;
        }
        #action-execute-btn {
            width: 100%;
            background-color: #00ffff;
            color: #000;
            border: 4px solid #ffff00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 14px;
            cursor: pointer;
            margin-top: 4px;
            font-weight: bold;
        }
        #action-execute-btn:hover:not(:disabled) { background-color: #33ffff; }
        #action-execute-btn:disabled { background-color: #222; border-color: #555; color: #666; cursor: not-allowed; }
        
        #message {
            font-size: 8.5px;
            margin-top: 4px;
            min-height: 55px;
            line-height: 1.5;
            color: #ffff00;
            background-color: #001122;
            border: 3px solid #00ffff;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>

    <h1>MITOS TÁCTICOS 8-BIT</h1>
    
    <div id="game-container">
        
        <div class="stats-panel">
            <span id="hero-lvl-txt">RONDAS: 0</span>
            <span id="score-txt">PTS: 0</span>
        </div>

        <div id="entorno-banner">CLIMA: DESPEJADO</div>

        <div class="bars-container">
            <div class="bar-title">TU ESTADO ACTUAL</div>
            <div class="bar-row"><span class="bar-label">HP</span><div class="bar-outer"><div id="hero-hp-fill" class="bar-inner-hp"></div></div></div>
            <div class="bar-row"><span class="bar-label">MAN</span><div class="bar-outer"><div id="hero-mana-fill" class="bar-inner-mana"></div></div></div>
            <div class="bar-row"><span class="bar-label">ENE</span><div class="bar-outer"><div id="hero-energy-fill" class="bar-inner-energy"></div></div></div>
        </div>

        <div class="main-layout">
            <div class="left-image-side">
                <div id="window-frame">
                    <img id="monster-img" src="" alt="Criatura" style="display: none;">
                    <div id="monster-placeholder">🚪</div>
                </div>
            </div>

            <div class="right-info-side">
                <div class="bars-container">
                    <div class="bar-title">ANÁLISIS RIVAL</div>
                    <div class="bar-row"><span class="bar-label">HP</span><div class="bar-outer"><div id="enemy-hp-fill" class="bar-inner-hp"></div></div></div>
                    <div class="bar-row"><span class="bar-label">MAN</span><div class="bar-outer"><div id="enemy-mana-fill" class="bar-inner-mana"></div></div></div>
                    <div class="bar-row"><span class="bar-label">ENE</span><div class="bar-outer"><div id="enemy-energy-fill" class="bar-inner-energy"></div></div></div>
                </div>
                <div class="info-card" id="info-element">ELEM: ?</div>
            </div>
        </div>

        <div id="timer-bar-container"><div id="timer-bar-fill"></div></div>

        <!-- 1. Elemento -->
        <div class="selector-row">
            <span class="selector-label">1. ELEMENTO OFENSIVO/DEFENSIVO:</span>
            <div class="row-grid-5">
                <button class="tactical-btn" onclick="selectOpt('element', 'Fuego', this)">FUEGO</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Hielo', this)">HIELO</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Tierra', this)">TIERRA</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Rayos', this)">RAYOS</button>
                <button class="tactical-btn" onclick="selectOpt('element', 'Veneno', this)">VENENO</button>
            </div>
        </div>

        <!-- 2. Acción -->
        <div class="selector-row">
            <span class="selector-label">2. DECISIÓN TÁCTICA:</span>
            <div class="row-grid-4">
                <button class="tactical-btn" onclick="selectOpt('action', 'Fisico', this)">ATQ FÍSICO</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Hechizo', this)">HECHIZO</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Defensa', this)">DEFENSA</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Agil', this)">GLP ÁGIL</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Drenaje', this)">DRENAJE</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Contra', this)">CONTRA</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Pocion', this)">POCIÓN</button>
                <button class="tactical-btn" onclick="selectOpt('action', 'Concentracion', this)">CONCENTRAR</button>
            </div>
        </div>

        <!-- 3. Riesgo -->
        <div class="selector-row">
            <span class="selector-label">3. POSTURA DE RIESGO:</span>
            <div class="row-grid-3">
                <button class="tactical-btn" style="color:#ff5555; border-color:#ff5555; font-size:6px;" onclick="selectOpt('risk', 'Temeraria', this)">TEMERARIA<br>(x2 Pts)</button>
                <button class="tactical-btn" style="color:#ffff00; border-color:#ffff00; font-size:6px;" onclick="selectOpt('risk', 'Equilibrada', this)">EQUILIBRADA<br>(Normal)</button>
                <button class="tactical-btn" style="color:#55ff55; border-color:#55ff55; font-size:6px;" onclick="selectOpt('risk', 'Conservadora', this)">CONSERVADORA<br>(Salva vida)</button>
            </div>
        </div>

        <button id="action-execute-btn" onclick="evaluateTactics()" disabled>⚖️ CONFIRMAR JUGADA</button>

        <div id="message">🚪 Esperando situación táctica...</div>
    </div>
        <script>
        const CONFIG_TURN_TIME_LIMIT = 25; 
        
        const elements = ["Fuego", "Hielo", "Tierra", "Rayos", "Veneno"];
        const elementalWinsAgainst = {
            "Fuego": ["Hielo", "Veneno"],
            "Hielo": ["Tierra", "Rayos"],
            "Tierra": ["Rayos", "Fuego"],
            "Rayos": ["Veneno", "Hielo"],
            "Veneno": ["Tierra", "Fuego"]
        };

        const entornos = [
            { nombre: "DESPEJADO", desc: "Sin efectos adicionales." },
            { nombre: "NIEBLA DENSA", desc: "Ataques Físicos fallan si tu Energía es < 50%." },
            { nombre: "TORMENTA MÁGICA", desc: "Hechizos potentes, Drenaje penalizado." },
            { nombre: "CALOR EXTREMO", desc: "Defender gasta toda tu Energía." }
        ];

        let roundsSurvived = 0;
        let score = 0;
        let currentEntorno = entornos[0];

        let hero = { hp: 0, mana: 0, energy: 0 };
        let enemy = { element: "", hp: 0, mana: 0, energy: 0 };
        
        let combatActive = false;
        let selection = { element: null, action: null, risk: null };
        let timeLeft = CONFIG_TURN_TIME_LIMIT;
        let timerInterval = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function startGame() {
            roundsSurvived = 0; 
            score = 0;
            document.getElementById("message").innerHTML = "¡Analiza las barras y el clima!";
            updateUI(); 
            nextEncounter();
        }

        function updateUI() {
            document.getElementById("hero-lvl-txt").innerText = `RONDAS: ${roundsSurvived}`;
            document.getElementById("score-txt").innerText = `PTS: ${score}`;
            document.getElementById("entorno-banner").innerText = `CLIMA: ${currentEntorno.nombre} - ${currentEntorno.desc}`;
            
            document.getElementById("hero-hp-fill").style.width = `${hero.hp}%`;
            document.getElementById("hero-mana-fill").style.width = `${hero.mana}%`;
            document.getElementById("hero-energy-fill").style.width = `${hero.energy}%`;

            document.getElementById("enemy-hp-fill").style.width = `${enemy.hp}%`;
            document.getElementById("enemy-mana-fill").style.width = `${enemy.mana}%`;
            document.getElementById("enemy-energy-fill").style.width = `${enemy.energy}%`;
        }

        function nextEncounter() {
            combatActive = false;
            document.getElementById("monster-placeholder").style.display = "flex";
            document.getElementById("monster-img").style.display = "none";
            
            resetSelections();
            setAllButtonsEnabled(false);
            setTimeout(() => { openWindow(); }, 800);
        }

        function openWindow() {
            playBeep(440, 'square', 0.1); 
            let randomId = 1; 
            let formattedName = String(randomId).padStart(4, '0') + ".jpg";

            currentEntorno = entornos[Math.floor(Math.random() * entornos.length)];

            hero.hp = Math.floor(Math.random() * 80) + 20;
            hero.mana = Math.floor(Math.random() * 100);
            hero.energy = Math.floor(Math.random() * 100);

            enemy.element = elements[Math.floor(Math.random() * elements.length)];
            enemy.hp = Math.floor(Math.random() * 80) + 20;
            enemy.mana = Math.floor(Math.random() * 100);
            enemy.energy = Math.floor(Math.random() * 100);

            updateUI();

            let imgElement = document.getElementById("monster-img");
            imgElement.src = `multimedia/${formattedName}`;
            applyElementFilter(enemy.element, imgElement);

            document.getElementById("monster-placeholder").style.display = "none";
            imgElement.style.display = "block";
            document.getElementById("info-element").innerText = `ELEM: ${enemy.element.toUpperCase()}`;
            
            document.getElementById("message").innerHTML = "⚠️ ¡Elige Elemento, Táctica y Riesgo antes de que acabe el tiempo!";
            combatActive = true;
            setAllButtonsEnabled(true);
            startTimer();
        }

        function applyElementFilter(element, img) {
            let bf = "grayscale(100%) contrast(150%) ";
            if (element === "Hielo") img.style.filter = bf + "sepia(100%) hue-rotate(140deg) saturate(400%)";
            else if (element === "Fuego") img.style.filter = bf + "sepia(100%) hue-rotate(-30deg) saturate(500%)";
            else if (element === "Tierra") img.style.filter = bf + "sepia(100%) hue-rotate(60deg) saturate(300%)";
            else if (element === "Rayos") img.style.filter = bf + "sepia(100%) hue-rotate(55deg) saturate(600%) brightness(120%)";
            else if (element === "Veneno") img.style.filter = bf + "sepia(100%) hue-rotate(290deg) saturate(600%) brightness(110%)";
        }

        function triggerFlash(type) {
            playBeep(type === 'green' ? 800 : (type === 'red' ? 120 : 580), type === 'green' ? 'sine' : 'square', 0.2);
            let container = document.getElementById("game-container");
            let frame = document.getElementById("window-frame");
            let flashClass = (type === 'red') ? 'flash-red' : (type === 'green' ? 'flash-green' : 'flash-white');
            container.classList.add(flashClass); frame.classList.add(flashClass);
            setTimeout(() => { container.classList.remove(flashClass); frame.classList.remove(flashClass); }, 250);
        }

        function selectOpt(category, value, btn) {
            if (!combatActive) return;
            playBeep(800, 'sine', 0.05);
            selection[category] = value;

            let parentGrid = btn.parentNode;
            let buttons = parentGrid.getElementsByClassName("tactical-btn");
            for (let b of buttons) { b.classList.remove("selected"); }
            btn.classList.add("selected");

            if (selection.element && selection.action && selection.risk) {
                document.getElementById("action-execute-btn").disabled = false;
            }
        }

        function startTimer() {
            timeLeft = CONFIG_TURN_TIME_LIMIT;
            let timerFill = document.getElementById("timer-bar-fill");
            timerFill.style.width = "100%";
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                timerFill.style.width = Math.max(0, (timeLeft / CONFIG_TURN_TIME_LIMIT) * 100) + "%";
                if (timeLeft <= 0) { clearInterval(timerInterval); handleTimeOut(); }
            }, 100);
        }

        function handleTimeOut() {
            if (!combatActive) return;
            selection.element = "Ninguno"; 
            selection.action = "Nada"; 
            selection.risk = "Equilibrada";
            evaluateTactics();
        }

        function evaluateTactics() {
            if (!combatActive) return;
            clearInterval(timerInterval);
            combatActive = false;
            setAllButtonsEnabled(false);

            let report = "";
            let tacticScore = 0; 
            let penalizacionClima = false;

            if (elementalWinsAgainst[selection.element] && elementalWinsAgainst[selection.element].includes(enemy.element)) {
                tacticScore += 40; report += "[+] Elemento letal. ";
            } else if (selection.element === enemy.element) {
                tacticScore += 10; report += "[-] Elemento neutral. ";
            } else { 
                report += "[x] Desventaja elemental. "; 
            }

            if (currentEntorno.nombre === "NIEBLA DENSA" && selection.action === "Fisico" && hero.energy < 50) penalizacionClima = true;
            if (currentEntorno.nombre === "TORMENTA MÁGICA" && selection.action === "Hechizo") tacticScore += 20;
            if (currentEntorno.nombre === "TORMENTA MÁGICA" && selection.action === "Drenaje") penalizacionClima = true;
            if (currentEntorno.nombre === "CALOR EXTREMO" && (selection.action === "Defensa" || selection.action === "Concentracion")) hero.energy = 0;

            let optimalAction = false;
            let actionReason = "";

            if (selection.action === "Defensa" && (hero.hp <= 35 || enemy.energy >= 70)) { optimalAction = true; actionReason = "Buena cobertura."; } 
            else if (selection.action === "Pocion" && hero.hp <= 40) { optimalAction = true; actionReason = "Cura oportuna."; }
            else if (selection.action === "Concentracion" && hero.mana < 30 && hero.energy < 30) { optimalAction = true; actionReason = "Recarga táctica."; }
            else if (selection.action === "Fisico" && hero.energy >= 40 && enemy.energy <= 40 && !penalizacionClima) { optimalAction = true; actionReason = "Rival exhausto."; }
            else if (selection.action === "Agil" && enemy.energy > 50 && hero.energy > 50) { optimalAction = true; actionReason = "Golpe rápido."; }
            else if (selection.action === "Hechizo" && hero.mana >= 40 && enemy.mana <= 40) { optimalAction = true; actionReason = "Magia limpia."; }
            else if (selection.action === "Drenaje" && enemy.mana > 60 && !penalizacionClima) { optimalAction = true; actionReason = "Robo de maná exitoso."; }
            else if (selection.action === "Contra" && enemy.energy > 70 && hero.hp > 40) { optimalAction = true; actionReason = "Contraataque certero."; }
            
            if (penalizacionClima) report += "<br>[x] El Clima arruinó tu jugada.";
            else if (optimalAction) { tacticScore += 60; report += `<br>[+] Acción ideal: ${actionReason}`; }
            else { tacticScore += 15; report += "<br>[-] Decisión mejorable."; }

            let superaSituacion = false;
            if (selection.risk === "Temeraria") {
                if (tacticScore >= 80) { superaSituacion = true; tacticScore *= 2; report += "<br>💥 RIESGO ÉPICO (x2 Pts)"; }
                else superaSituacion = false;
            } else if (selection.risk === "Conservadora") {
                superaSituacion = true; 
                tacticScore = Math.floor(tacticScore / 2);
                report += "<br>🛡️ Supervivencia asegurada.";
            } else {
                if (tacticScore >= 60) superaSituacion = true;
            }

            document.getElementById("message").innerHTML = report;

            if (superaSituacion) {
                triggerFlash('green'); 
                roundsSurvived++; 
                score += tacticScore * 10;
                let best = localStorage.getItem("mitos_best_score") || 0;
                if (score > best) localStorage.setItem("mitos_best_score", score);
                setTimeout(() => { 
                    document.getElementById("message").innerHTML = report + "<br><b>🏆 ¡ÉXITO TÁCTICO! SIGUIENTE...</b>"; 
                    setTimeout(nextEncounter, 2000); 
                }, 1200);
            } else {
                triggerFlash('red'); 
                hero.hp = 0; 
                updateUI();
                document.getElementById("monster-img").style.display = "none";
                document.getElementById("monster-placeholder").style.display = "flex";
                document.getElementById("monster-placeholder").innerText = "💀";
                setTimeout(() => { 
                    document.getElementById("message").innerHTML = report + `<br><br>💀 FALLO TÁCTICO. Rondas: ${roundsSurvived}.<br>Recarga para reintentar.`; 
                }, 1000);
            }
        }

        function resetSelections() {
            selection = { element: null, action: null, risk: null };
            let allBtns = document.getElementsByClassName("tactical-btn");
            for (let b of allBtns) { b.classList.remove("selected"); }
            document.getElementById("action-execute-btn").disabled = true;
        }

        function setAllButtonsEnabled(enabled) {
            let allBtns = document.getElementsByClassName("tactical-btn");
            for (let b of allBtns) { b.disabled = !enabled; }
            if (!enabled) document.getElementById("action-execute-btn").disabled = true;
        }

        startGame();
    </script>
</body>
</html>
