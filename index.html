<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mitos Tácticos 8-Bits - Interfaz Dinámica por Clima</title>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <style>
        html, body {
            background-color: #000000;
            color: #00ffff;
            font-family: 'Press Start 2P', monospace;
            text-align: center;
            margin: 0;
            padding: 4px;
            width: 100%;
            height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
            transition: color 0.5s ease;
        }
        h1 {
            font-size: 13px;
            text-shadow: 2px 2px #333;
            margin: 4px 0;
            color: #ffff00;
        }
        #game-container {
            width: 100vw;
            max-width: 600px;
            margin: 0 auto;
            border: 4px solid var(--theme-color, #00ffff);
            background-color: #05050a;
            padding: 8px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            gap: 8px;
            box-shadow: 0 0 20px var(--theme-glow, rgba(0, 255, 255, 0.5));
            position: relative;
            transition: border-color 0.5s ease, box-shadow 0.5s ease;
        }
        .flash-red { background-color: #ff0000 !important; }
        .flash-white { background-color: #ffffff !important; }
        .flash-green { background-color: #00ff00 !important; }
        
        .stats-panel {
            font-size: 10px;
            display: flex;
            justify-content: space-between;
            border-bottom: 3px dashed var(--theme-color, #00ffff);
            padding-bottom: 6px;
            color: #ffff00;
            transition: border-color 0.5s ease;
        }
        
        #entorno-banner {
            background-color: #001122;
            border: 3px solid var(--theme-color, #00ffff);
            color: var(--theme-color, #00ffff);
            font-size: 8px;
            padding: 8px;
            line-height: 1.4;
            transition: border-color 0.5s ease, color 0.5s ease;
        }

        .main-layout {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }
        .left-image-side {
            flex: 1.1;
            display: flex;
            flex-direction: column;
        }
        .right-info-side {
            flex: 1.2;
            display: flex;
            flex-direction: column;
            gap: 6px;
            justify-content: space-between;
        }
        #window-frame {
            width: 100%;
            aspect-ratio: 9/16;
            border: 3px solid var(--theme-color, #00ffff);
            background-color: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: border-color 0.5s ease;
        }
        #monster-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            image-rendering: pixelated;
        }
        #monster-placeholder {
            font-size: 50px;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #000;
        }
        
        .bars-container {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #001122;
            border: 3px solid var(--theme-color, #00ffff);
            padding: 8px;
            height: 100%;
            box-sizing: border-box;
            justify-content: space-around;
            transition: border-color 0.5s ease;
        }
        .bar-title {
            font-size: 9px;
            color: var(--theme-color, #00ffff);
            text-align: center;
            margin-bottom: 4px;
            transition: color 0.5s ease;
        }
        .bar-row {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 8px;
            color: #fff;
        }
        .bar-label {
            width: 38px;
            text-align: left;
            color: #ffff00;
        }
        .bar-outer {
            flex: 1;
            height: 14px;
            background: #222;
            border: 2px solid #fff;
            position: relative;
        }
        .bar-inner-hp { background-color: #ff0000; height: 100%; width: 100%; transition: width 0.3s; }
        .bar-inner-mana { background-color: #0088ff; height: 100%; width: 100%; transition: width 0.3s; }
        .bar-inner-energy { background-color: #00cc44; height: 100%; width: 100%; transition: width 0.3s; }

        .info-card {
            background-color: #000;
            border: 3px solid #ffff00;
            font-size: 9px;
            padding: 10px 4px;
            text-align: center;
            color: var(--theme-color, #00ffff);
            transition: color 0.5s ease;
        }

        #timer-bar-container {
            width: 100%;
            background-color: #001122;
            border: 3px solid var(--theme-color, #00ffff);
            height: 10px;
            transition: border-color 0.5s ease;
        }
        #timer-bar-fill {
            background-color: var(--theme-color, #00ffff);
            height: 100%;
            width: 100%;
            transition: width 0.1s linear, background-color 0.5s ease;
        }

        .selector-row {
            margin-bottom: 3px;
            text-align: left;
        }
        .selector-label {
            font-size: 8px;
            color: #ffff00;
            margin-bottom: 4px;
            display: block;
        }
        .row-grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .row-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; }
        .row-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }

        .tactical-btn {
            background-color: #001122;
            color: var(--theme-color, #00ffff);
            border: 3px solid var(--theme-color, #00ffff);
            font-family: 'Press Start 2P', monospace;
            font-size: 7px;
            padding: 12px 2px;
            cursor: pointer;
            text-align: center;
            transition: all 0.1s, border-color 0.5s ease, color 0.5s ease;
        }
        .tactical-btn.selected {
            background-color: var(--theme-color, #00ffff);
            color: #000;
            border-color: #ffff00;
            transform: scale(1.05);
        }
        .tactical-btn:disabled {
            border-color: #333;
            color: #555;
            cursor: not-allowed;
        }
        #action-execute-btn {
            width: 100%;
            background-color: var(--theme-color, #00ffff);
            color: #000;
            border: 4px solid #ffff00;
            font-family: 'Press Start 2P', monospace;
            font-size: 10px;
            padding: 14px;
            cursor: pointer;
            margin-top: 4px;
            font-weight: bold;
            transition: background-color 0.5s ease;
        }
        #action-execute-btn:hover { filter: brightness(1.2); }
        
        #message {
            font-size: 8px;
            margin-top: 4px;
            min-height: 60px;
            line-height: 1.5;
            color: #ffff00;
            background-color: #001122;
            border: 3px solid var(--theme-color, #00ffff);
            padding: 8px;
            text-align: left;
            transition: border-color 0.5s ease;
        }
    </style>
</head>
<body>

    <h1>MITOS TÁCTICOS 8-BIT</h1>
    
    <div id="game-container">
        
        <div class="stats-panel">
            <span id="hero-lvl-txt">RONDAS: 0</span>
            <span id="score-txt">PTS: 0</span>
        </div>

        <div id="entorno-banner">CLIMA: DESPEJADO</div>

        <div class="bars-container">
            <div class="bar-title">TU ESTADO ACTUAL</div>
            <div class="bar-row"><span class="bar-label">HP</span><div class="bar-outer"><div id="hero-hp-fill" class="bar-inner-hp"></div></div></div>
            <div class="bar-row"><span class="bar-label">MAN</span><div class="bar-outer"><div id="hero-mana-fill" class="bar-inner-mana"></div></div></div>
            <div class="bar-row"><span class="bar-label">ENE</span><div class="bar-outer"><div id="hero-energy-fill" class="bar-inner-energy"></div></div></div>
        </div>

        <div class="main-layout">
            <div class="left-image-side">
                <div id="window-frame">
                    <img id="monster-img" src="" alt="Criatura" style="display: none;">
                    <div id="monster-placeholder">🚪</div>
                </div>
            </div>

            <div class="right-info-side">
                <div class="bars-container">
                    <div class="bar-title">ANÁLISIS RIVAL</div>
                    <div class="bar-row"><span class="bar-label">HP</span><div class="bar-outer"><div id="enemy-hp-fill" class="bar-inner-hp"></div></div></div>
                    <div class="bar-row"><span class="bar-label">MAN</span><div class="bar-outer"><div id="enemy-mana-fill" class="bar-inner-mana"></div></div></div>
                    <div class="bar-row"><span class="bar-label">ENE</span><div class="bar-outer"><div id="enemy-energy-fill" class="bar-inner-energy"></div></div></div>
                </div>
                <div class="info-card" id="info-element">ELEM: ?</div>
            </div>
        </div>

        <div id="timer-bar-container"><div id="timer-bar-fill"></div></div>

        <!-- 1. Elemento -->
        <div class="selector-row">
            <span class="selector-label">1. ELEMENTO (Elige SÓLO UNO):</span>
            <div class="row-grid-5">
                <button class="tactical-btn elem-btn" onclick="selectElement('Fuego', this)">FUEGO</button>
                <button class="tactical-btn elem-btn" onclick="selectElement('Hielo', this)">HIELO</button>
                <button class="tactical-btn elem-btn" onclick="selectElement('Tierra', this)">TIERRA</button>
                <button class="tactical-btn elem-btn" onclick="selectElement('Rayos', this)">RAYOS</button>
                <button class="tactical-btn elem-btn" onclick="selectElement('Veneno', this)">VENENO</button>
            </div>
        </div>

        <!-- 2. Acciones -->
        <div class="selector-row">
            <span class="selector-label">2. TÁCTICAS (Usa "ARMADURA" para anular el clima):</span>
            <div class="row-grid-4">
                <button class="tactical-btn action-btn" onclick="toggleAction('Fisico', this)">ATQ FÍSICO</button>
                <button class="tactical-btn action-btn" onclick="toggleAction('Hechizo', this)">HECHIZO</button>
                <button class="tactical-btn action-btn" onclick="toggleAction('Armadura', this)">ARMADURA</button>
                <button class="tactical-btn action-btn" onclick="toggleAction('Defensa', this)">DEFENSA</button>
                <button class="tactical-btn action-btn" onclick="toggleAction('Agil', this)">GLP ÁGIL</button>
                <button class="tactical-btn action-btn" onclick="toggleAction('Drenaje', this)">DRENAJE</button>
                <button class="tactical-btn action-btn" onclick="toggleAction('Pocion', this)">POCIÓN</button>
                <button class="tactical-btn action-btn" onclick="toggleAction('Concentracion', this)">CONCENTRAR</button>
            </div>
        </div>

        <!-- 3. Riesgo -->
        <div class="selector-row">
            <span class="selector-label">3. POSTURA DE RIESGO:</span>
            <div class="row-grid-3">
                <button class="tactical-btn risk-btn" style="color:#ff5555; border-color:#ff5555; font-size:6px;" onclick="selectRisk('Temeraria', this)">TEMERARIA<br>(x2 Pts)</button>
                <button class="tactical-btn risk-btn selected" id="default-risk-btn" style="color:#ffff00; border-color:#ffff00; font-size:6px;" onclick="selectRisk('Equilibrada', this)">EQUILIBRADA<br>(Normal)</button>
                <button class="tactical-btn risk-btn" style="color:#55ff55; border-color:#55ff55; font-size:6px;" onclick="selectRisk('Conservadora', this)">CONSERVADORA<br>(Salva vida)</button>
            </div>
        </div>

        <button id="action-execute-btn" onclick="evaluateTactics()">⚖️ CONFIRMAR JUGADA</button>

        <div id="message">🚪 ¡Combate iniciado! Elige tus tácticas con cabeza.</div>
    </div>
        <script>
        const CONFIG_TURN_TIME_LIMIT = 30; 
        
        const elements = ["Fuego", "Hielo", "Tierra", "Rayos", "Veneno"];
        const elementalWinsAgainst = {
            "Fuego": ["Hielo", "Veneno"],
            "Hielo": ["Tierra", "Rayos"],
            "Tierra": ["Rayos", "Fuego"],
            "Rayos": ["Veneno", "Hielo"],
            "Veneno": ["Tierra", "Fuego"]
        };

        // Climas con su respectivo tipo elemental ('fuego', 'hielo', 'rayos', 'tierra')
        const entornos = [
            { nombre: "DESPEJADO", desc: "Sin afinidad elemental adversa.", severidad: 0, elementoBase: null, tipoClima: "hielo" },
            
            // Fuego (Naranja)
            { nombre: "CLIMA FUEGO (LEVE)", desc: "Calor leve. Usa Hielo o Armadura.", severidad: 1, elementoBase: "Fuego", tipoClima: "fuego" },
            { nombre: "CLIMA FUEGO (MODERADO)", desc: "Sequía intensa afecta energía.", severidad: 2, elementoBase: "Fuego", tipoClima: "fuego" },
            { nombre: "CLIMA FUEGO (EXTREMO)", desc: "Ola de calor abrasiva letal.", severidad: 3, elementoBase: "Fuego", tipoClima: "fuego" },
            
            // Hielo (Cian)
            { nombre: "CLIMA HIELO (LEVE)", desc: "Frío leve. Usa Fuego o Armadura.", severidad: 1, elementoBase: "Hielo", tipoClima: "hielo" },
            { nombre: "CLIMA HIELO (MODERADO)", desc: "Ventisca entumece acciones.", severidad: 2, elementoBase: "Hielo", tipoClima: "hielo" },
            { nombre: "CLIMA HIELO (EXTREMO)", desc: "Congelación absoluta mortal.", severidad: 3, elementoBase: "Hielo", tipoClima: "hielo" },
            
            // Rayos (Blanco)
            { nombre: "CLIMA RAYOS (LEVE)", desc: "Estática menor. Usa Tierra o Armadura.", severidad: 1, elementoBase: "Rayos", tipoClima: "rayos" },
            { nombre: "CLIMA RAYOS (MODERADO)", desc: "Tormenta eléctrica drena maná.", severidad: 2, elementoBase: "Rayos", tipoClima: "rayos" },
            { nombre: "CLIMA RAYOS (EXTREMO)", desc: "Tormenta de rayos destructiva.", severidad: 3, elementoBase: "Rayos", tipoClima: "rayos" },
            
            // Tierra / Veneno (Verde)
            { nombre: "CLIMA TOXICO (LEVE)", desc: "Niebla leve. Usa Rayos o Armadura.", severidad: 1, elementoBase: "Veneno", tipoClima: "tierra" },
            { nombre: "CLIMA TOXICO (MODERADO)", desc: "Gas denso entorpece ataques.", severidad: 2, elementoBase: "Veneno", tipoClima: "tierra" },
            { nombre: "CLIMA TOXICO (EXTREMO)", desc: "Miasma venenoso mortal.", severidad: 3, elementoBase: "Veneno", tipoClima: "tierra" }
        ];

        let roundsSurvived = 0;
        let score = 0;
        let currentEntorno = entornos[0];

        let hero = { hp: 100, mana: 100, energy: 100 };
        let enemy = { element: "", hp: 100, mana: 100, energy: 100 };
        
        let combatActive = false;
        let selection = { element: null, actions: [], risk: 'Equilibrada' };
        let timeLeft = CONFIG_TURN_TIME_LIMIT;
        let timerInterval = null;

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playBeep(freq, type, duration) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            let osc = audioCtx.createOscillator();
            let gain = audioCtx.createGain();
            osc.type = type; osc.frequency.value = freq;
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + duration);
            osc.connect(gain); gain.connect(audioCtx.destination);
            osc.start(); osc.stop(audioCtx.currentTime + duration);
        }

        function applyTheme(tipo) {
            let colorHex = "#00ffff"; // Cian por defecto (hielo)
            let glowRgba = "rgba(0, 255, 255, 0.5)";

            if (tipo === "fuego") {
                colorHex = "#ff6600"; // Naranja
                glowRgba = "rgba(255, 102, 0, 0.5)";
            } else if (tipo === "rayos") {
                colorHex = "#ffffff"; // Blanco
                glowRgba = "rgba(255, 255, 255, 0.5)";
            } else if (tipo === "tierra") {
                colorHex = "#00ff66"; // Verde
                glowRgba = "rgba(0, 255, 102, 0.5)";
            }

            document.documentElement.style.setProperty('--theme-color', colorHex);
            document.documentElement.style.setProperty('--theme-glow', glowRgba);
        }

        function startGame() {
            roundsSurvived = 0; score = 0;
            document.getElementById("message").innerHTML = "¡Analiza el clima y las barras!";
            updateUI(); nextEncounter();
        }

        function updateUI() {
            document.getElementById("hero-lvl-txt").innerText = `RONDAS: ${roundsSurvived}`;
            document.getElementById("score-txt").innerText = `PTS: ${score}`;
            document.getElementById("entorno-banner").innerText = `CLIMA: ${currentEntorno.nombre} - ${currentEntorno.desc}`;
            
            document.getElementById("hero-hp-fill").style.width = `${Math.max(0, hero.hp)}%`;
            document.getElementById("hero-mana-fill").style.width = `${Math.max(0, hero.mana)}%`;
            document.getElementById("hero-energy-fill").style.width = `${Math.max(0, hero.energy)}%`;

            document.getElementById("enemy-hp-fill").style.width = `${enemy.hp}%`;
            document.getElementById("enemy-mana-fill").style.width = `${enemy.mana}%`;
            document.getElementById("enemy-energy-fill").style.width = `${enemy.energy}%`;
        }

        function nextEncounter() {
            combatActive = false;
            document.getElementById("monster-placeholder").style.display = "flex";
            document.getElementById("monster-img").style.display = "none";
            resetSelections();
            setTimeout(() => { openWindow(); }, 800);
        }

        function openWindow() {
            playBeep(440, 'square', 0.1); 
            let randomId = 1; 
            let formattedName = String(randomId).padStart(4, '0') + ".jpg";

            currentEntorno = entornos[Math.floor(Math.random() * entornos.length)];
            applyTheme(currentEntorno.tipoClima);

            hero.hp = 100; hero.mana = 100; hero.energy = 100;
            enemy.element = elements[Math.floor(Math.random() * elements.length)];
            enemy.hp = Math.floor(Math.random() * 50) + 50;
            enemy.mana = Math.floor(Math.random() * 100);
            enemy.energy = Math.floor(Math.random() * 100);

            updateUI();

            let imgElement = document.getElementById("monster-img");
            imgElement.src = `multimedia/${formattedName}`;
            applyElementFilter(enemy.element, imgElement);

            document.getElementById("monster-placeholder").style.display = "none";
            imgElement.style.display = "block";
            document.getElementById("info-element").innerText = `ELEM: ${enemy.element.toUpperCase()}`;
            
            document.getElementById("message").innerHTML = `⚠️ Clima: ${currentEntorno.nombre}. Usa Armadura o replica con el elemento opuesto.`;
            combatActive = true;
            startTimer();
        }

        function applyElementFilter(element, img) {
            let bf = "grayscale(100%) contrast(150%) ";
            if (element === "Hielo") img.style.filter = bf + "sepia(100%) hue-rotate(140deg) saturate(400%)";
            else if (element === "Fuego") img.style.filter = bf + "sepia(100%) hue-rotate(-30deg) saturate(500%)";
            else if (element === "Tierra") img.style.filter = bf + "sepia(100%) hue-rotate(60deg) saturate(300%)";
            else if (element === "Rayos") img.style.filter = bf + "sepia(100%) hue-rotate(55deg) saturate(600%) brightness(120%)";
            else if (element === "Veneno") img.style.filter = bf + "sepia(100%) hue-rotate(290deg) saturate(600%) brightness(110%)";
        }

        function triggerFlash(type) {
            playBeep(type === 'green' ? 800 : (type === 'red' ? 120 : 580), type === 'green' ? 'sine' : 'square', 0.2);
            let container = document.getElementById("game-container");
            let frame = document.getElementById("window-frame");
            let flashClass = (type === 'red') ? 'flash-red' : (type === 'green' ? 'flash-green' : 'flash-white');
            container.classList.add(flashClass); frame.classList.add(flashClass);
            setTimeout(() => { container.classList.remove(flashClass); frame.classList.remove(flashClass); }, 250);
        }

        function selectElement(val, btn) {
            if (!combatActive) return;
            playBeep(700, 'sine', 0.05);
            selection.element = val;
            let btns = document.getElementsByClassName("elem-btn");
            for (let b of btns) b.classList.remove("selected");
            btn.classList.add("selected");
        }

        function toggleAction(val, btn) {
            if (!combatActive) return;
            playBeep(900, 'sine', 0.05);
            
            hero.hp -= 6; hero.mana -= 5; hero.energy -= 8;
            updateUI();

            if (selection.actions.includes(val)) {
                selection.actions = selection.actions.filter(a => a !== val);
                btn.classList.remove("selected");
            } else {
                selection.actions.push(val);
                btn.classList.add("selected");
            }
        }

        function selectRisk(val, btn) {
            if (!combatActive) return;
            playBeep(700, 'sine', 0.05);
            selection.risk = val;
            let btns = document.getElementsByClassName("risk-btn");
            for (let b of btns) b.classList.remove("selected");
            btn.classList.add("selected");
        }

        function startTimer() {
            timeLeft = CONFIG_TURN_TIME_LIMIT;
            let timerFill = document.getElementById("timer-bar-fill");
            timerFill.style.width = "100%";
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft -= 0.1;
                timerFill.style.width = Math.max(0, (timeLeft / CONFIG_TURN_TIME_LIMIT) * 100) + "%";
                if (timeLeft <= 0) { clearInterval(timerInterval); evaluateTactics(); }
            }, 100);
        }

        function evaluateTactics() {
            if (!combatActive) return;
            clearInterval(timerInterval);
            combatActive = false;

            if (!selection.risk) selection.risk = 'Equilibrada';

            let report = "";
            let tacticScore = 0; 
            let usaArmadura = selection.actions.includes("Armadura");

            if (currentEntorno.severidad > 0) {
                if (usaArmadura) {
                    tacticScore += 30;
                    report += `🛡️ <span style="color:#00ff00">¡Armadura neutraliza el ${currentEntorno.nombre}!</span><br>`;
                    selection.element = null; 
                } else if (selection.element && elementalWinsAgainst[selection.element] && elementalWinsAgainst[selection.element].includes(currentEntorno.elementoBase)) {
                    tacticScore += 35;
                    report += `⚡ <span style="color:#00ff00">¡Réplica elemental perfecta contra el ${currentEntorno.nombre}!</span><br>`;
                } else {
                    tacticScore -= (currentEntorno.severidad * 25);
                    report += `⚠️ <span style="color:#ff5555">¡Clima ${currentEntorno.nombre} no replicado correctamente ni protegido!</span><br>`;
                }
            }

            if (selection.element && currentEntorno.severidad === 0) {
                if (elementalWinsAgainst[selection.element] && elementalWinsAgainst[selection.element].includes(enemy.element)) {
                    tacticScore += 35; report += "[+] Elemento efectivo contra el rival. ";
                } else if (selection.element === enemy.element) {
                    tacticScore += 10; report += "[-] Elemento neutral. ";
                } else { report += "[x] Elemento débil. "; }
            }

            let actionCount = selection.actions.length;
            if (actionCount === 0) {
                report += "<br>[x] No elegiste ninguna táctica.";
            } else {
                let goodActions = 0;
                selection.actions.forEach(act => {
                    if (act === "Defensa" && hero.hp < 50) goodActions++;
                    else if (act === "Pocion" && hero.hp < 40) goodActions++;
                    else if (act === "Fisico" && enemy.energy < 50) goodActions++;
                    else if (act === "Hechizo" && enemy.mana < 50) goodActions++;
                    else if (act === "Armadura") goodActions++; 
                    else if (act === "Agil" && enemy.energy >= 50) goodActions++;
                    else if (act === "Drenaje" && enemy.mana >= 50) goodActions++;
                    else tacticScore -= 5;
                });
                tacticScore += (goodActions * 20);
                if (actionCount > 3) tacticScore -= (actionCount * 10);
            }

            let superaSituacion = false;
            if (selection.risk === "Temeraria") {
                if (tacticScore >= 65) { superaSituacion = true; tacticScore *= 2; report += "<br>💥 RIESGO ÉPICO (x2 Pts)"; }
                else superaSituacion = false;
            } else if (selection.risk === "Conservadora") {
                superaSituacion = true; tacticScore = Math.floor(tacticScore / 2);
                report += "<br>🛡️ Supervivencia conservadora.";
            } else {
                if (tacticScore >= 45) superaSituacion = true;
                report += "<br>⚖️ Postura Equilibrada.";
            }

            if (hero.hp <= 0) {
                superaSituacion = false;
                report += "<br>💀 Colapso por agotamiento (HP a 0).";
            }

            document.getElementById("message").innerHTML = report;

            if (superaSituacion) {
                triggerFlash('green'); roundsSurvived++; score += Math.max(10, tacticScore * 10);
                let best = localStorage.getItem("mitos_best_score") || 0;
                if (score > best) localStorage.setItem("mitos_best_score", score);
                setTimeout(() => { document.getElementById("message").innerHTML = report + "<br><b>🏆 ¡VICTORIA! SIGUIENTE RONDA...</b>"; setTimeout(nextEncounter, 2000); }, 1200);
            } else {
                triggerFlash('red'); hero.hp = 0; updateUI();
                document.getElementById("monster-img").style.display = "none";
                document.getElementById("monster-placeholder").style.display = "flex";
                document.getElementById("monster-placeholder").innerText = "💀";
                setTimeout(() => { document.getElementById("message").innerHTML = report + `<br><br>💀 DERROTADO. Rondas: ${roundsSurvived}.<br>Recarga para reintentar.`; }, 1000);
            }
        }

        function resetSelections() {
            selection = { element: null, actions: [], risk: 'Equilibrada' };
            let allBtns = document.getElementsByClassName("tactical-btn");
            for (let b of allBtns) {
                if (!b.id.includes('default-risk')) b.classList.remove("selected");
            }
            document.getElementById('default-risk-btn').classList.add('selected');
        }

        startGame();
    </script>
</body>
</html>
